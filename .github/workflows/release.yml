name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ingest ${{ github.ref_name }}'
          releaseBody: |
            ## Install

            1. Download `Ingest_*_aarch64.dmg` below
            2. Open the DMG and drag Ingest to Applications
            3. **If you see "damaged and can't be opened"** — run this in Terminal, then try again:
            ```
            xattr -dr com.apple.quarantine /Applications/Ingest.app
            ```
            > This is a macOS security prompt for apps without an Apple code signature. It's a one-time step per version.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
